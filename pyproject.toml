[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryanytime-method"
version = "0.1.0"
description = "Minimal reference implementation of QueryAnytime's SET and TrackState method."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["torch>=2.1", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["queryanytime_method*"]

[project.scripts]
queryanytime-method-demo = "queryanytime_method.demo:main"
